defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: "/opt/data/private/gs_opd/sft"
    project_name: rlinf
    experiment_name: "pi05_libero_full_trajectory_lora_continue_20261020_attempt2"
    logger_backends: ["tensorboard"]
  max_epochs: 3
  max_steps: -1
  val_check_interval: -1
  save_interval: 3375
  resume_dir: null

data:
  train_data_paths: "/workspace/zy_workspace/RLinf/logs/gs_opd/mink_panda_physical_v3/live_left_bspline_osc_adaptive_20261019_attempt1/lerobot_full_episode_v21"
  val_data_paths: "/workspace/zy_workspace/RLinf/logs/gs_opd/mink_panda_physical_v3/live_left_bspline_osc_adaptive_20261019_attempt1/lerobot_full_episode_v21"
  num_workers: 0
  expected_frames: 845
  action_horizon: 10
  phase_boundaries: [55, 804]
  balanced_windows_per_phase: 750
  eval_windows_per_phase: 16

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  eval_batch_size: 1
  global_batch_size: 2
  seed: 20261020

  model:
    precision: null
    model_path: "/workspace/zy_workspace/checkpoints/gs_opd/pi05_rlinf_libero_sft"
    num_action_chunks: 10
    action_dim: 7
    use_proprio: true
    is_lora: false
    lora_rank: 32
    add_value_head: false
    pi05: true
    openpi:
      task: sft
      embed_dtype: bf16
      config_name: "pi05_libero"
      num_images_in_input: 2
      action_chunk: 10
      action_env_dim: 7
      model_action_dim: 32
      num_steps: 3
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m_lora"
      max_token_len: 200
      torch_compile: false
    openpi_data:
      norm_stats_path: "/workspace/zy_workspace/checkpoints/gs_opd/pi05_rlinf_libero_sft/physical-intelligence/libero/norm_stats.json"

  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 3375
    lr_warmup_steps: 10
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 1.0e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

gs_opd:
  initial_adapter_path: "/workspace/zy_workspace/RLinf/logs/gs_opd/sft/pi05_libero_full_trajectory_lora_20261019_attempt1/lora_adapter.pt"
  flow_eval_seed: 20261020
  action_eval_seed: 20261020
  action_eval_solver_steps: 3
  carry_plateau_relative_threshold: 0.01
  carry_regression_stop_relative_threshold: 0.25

reward:
  use_reward_model: false

critic:
  use_critic_model: false
